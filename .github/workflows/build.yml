name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with the macOS 26 SDK
        shell: bash
        run: |
          for xcode in /Applications/Xcode_26*.app; do
            if [[ -d "$xcode" ]]; then
              sudo xcode-select --switch "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
      - name: Build universal app
        run: bash apps/macos/Scripts/build.sh
      - name: Test
        run: bash apps/macos/Scripts/test.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install DMG packaging tools
        run: |
          python -m venv "$RUNNER_TEMP/hue-dmg-tools"
          "$RUNNER_TEMP/hue-dmg-tools/bin/python" -m pip install -r apps/macos/Scripts/requirements-dmg.txt
      - name: Create preview DMG
        env:
          HUE_APP_PATH: ${{ github.workspace }}/apps/macos/build/Hue.app
          HUE_DMGBUILD: ${{ runner.temp }}/hue-dmg-tools/bin/dmgbuild
        run: bash apps/macos/Scripts/package.sh "$GITHUB_WORKSPACE/artifacts/Hue-macOS-Universal-preview.dmg"
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: Hue-macOS-Universal-preview
          path: artifacts/Hue-macOS-Universal-preview.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core logic
        run: dotnet test apps/windows/Hue.Core.Tests --configuration Release
      - name: Build self-contained x64 app
        shell: pwsh
        run: ./apps/windows/Scripts/build.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory "${{ github.workspace }}/artifacts/win-x64"
      - name: Build self-contained ARM64 app
        shell: pwsh
        run: ./apps/windows/Scripts/build.ps1 -Configuration Release -Runtime win-arm64 -OutputDirectory "${{ github.workspace }}/artifacts/win-arm64"
      - name: Create installer
        shell: pwsh
        run: ./apps/windows/Scripts/package.ps1 -X64AppDirectory "${{ github.workspace }}/artifacts/win-x64" -Arm64AppDirectory "${{ github.workspace }}/artifacts/win-arm64" -OutputDirectory "${{ github.workspace }}/artifacts/installers"
      - name: Install preview
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installers/Hue-Setup.exe'
          $installPath = Join-Path $env:RUNNER_TEMP 'Hue-installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $installPath + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed with exit code $($process.ExitCode)." }
          foreach ($file in 'Hue.exe', 'coreclr.dll') {
            $expected = Get-FileHash (Join-Path $env:GITHUB_WORKSPACE "artifacts/win-x64/$file")
            $installed = Get-FileHash (Join-Path $installPath $file)
            if ($installed.Hash -ne $expected.Hash) { throw "The installer did not select the native x64 $file." }
          }
      - name: Test the packaged app
        shell: pwsh
        run: |
          $capturePath = Join-Path $env:RUNNER_TEMP 'hue-smoke'
          New-Item -ItemType Directory -Force $capturePath | Out-Null
          $appPath = Join-Path $env:RUNNER_TEMP 'Hue-installed/Hue.exe'
          $process = Start-Process -FilePath $appPath -ArgumentList @('--smoke-test', '--capture-directory', ('"' + $capturePath + '"')) -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'The app did not finish its smoke test.'
          }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)." }
          $resultPath = Join-Path $capturePath 'smoke-result.json'
          if (-not (Test-Path $resultPath)) { throw 'The smoke test did not write its result.' }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "Smoke test failed: $($result.error)" }
          Get-Content $resultPath
      - name: Uninstall preview
        if: always()
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP 'Hue-installed'
          $uninstaller = Join-Path $installPath 'unins000.exe'
          if (Test-Path $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstall failed with exit code $($process.ExitCode)." }
            if (Test-Path (Join-Path $installPath 'Hue.exe')) { throw 'Uninstall left the app executable behind.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Hue-Windows-preview
          path: artifacts/installers/Hue-Setup.exe
          if-no-files-found: error
          retention-days: 14
